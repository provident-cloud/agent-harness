# bin/init --answers input that reproduces this team's config/ on any machine.
version: 1
team: turbolapper
# The tree Claude Code actually opens. This must match where you work: a
# workspace_root pointing at a second, unused clone yields an index that
# silently describes stale code. (Was ~/Documents/repos, which held clones
# 4 days behind origin that no Claude session had ever opened.)
workspace_root: ~/src/github.com/adviser-labs
tier: auto
repos:
- name: turbolapper-mac
  remote: git@github-personal:adviserlabs/turbolapper-super-mac.git
  branch: main
  description: Superset macOS app -- Local Data Connector with GUI, MCP server, CLI,
    multi-provider auto-modeling.
- name: turbolapper-fm-mac
  remote: git@github-personal:adviserlabs/turbolapper-fm-mac.git
  branch: main
  description: Apple Foundation Models edition -- streamlined on-device report builder,
    forked from the superset.
# Scaffold only as of 2026-08-16 -- 14 placeholder READMEs, no code. Listed so it
# is cloned and indexed the moment code lands. The org is `adviserlabs`, no
# hyphen; a local clone here carried a dead `adviser-labs` remote for days
# because that org does not exist and nothing checks a remote until it is used.
- name: turbolapper-apple
  remote: git@github-personal:adviserlabs/turbolapper-apple.git
  branch: main
  description: Non-AFM Apple app variant -- same Apple shell driven by open models
    (Qwen, Kimi, Gemma) instead of Apple Foundation Models.
oss:
  enabled: false
  base_url: https://models.mixlayer.ai/v1
  api_key_env: OSS_API_KEY
frontier:
  enabled: true
  api_key_env: ANTHROPIC_API_KEY
