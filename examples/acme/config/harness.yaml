# Generated by bin/init. Safe to hand-edit; re-running init needs --force to replace it.
# tier: auto re-detects RAM on every run, which is what makes this directory
# portable between machines. Pin 128gb/64gb/32gb only to override detection.
# The hosted rung reads its URL and key from the environment, not from here:
# export OSS_API_BASE=https://models.mixlayer.ai/v1 in .envrc.
version: 1
team: acme
workspace_root: ~/workspace/acme
tier: auto
litellm:
  host: 127.0.0.1
  port: 4000
oss:
  enabled: true
  api_base_env: OSS_API_BASE
  api_key_env: OSS_API_KEY
frontier:
  enabled: false
  api_key_env: ANTHROPIC_API_KEY
