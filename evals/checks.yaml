# Harness self-checks for `bin/eval`. Unlike cases.yaml (per-team agent
# stumbles, ships empty), these test the harness itself: deterministic, no
# agent, no judge, no LiteLLM proxy. Safe for CI.
#
#   bin/eval --checks-only                     all checks against this checkout
#   bin/eval --checks-only --rev origin/main   today's checks against an older tree
#
# Fields: id (unique), run (bash, cwd = the target tree; $HARNESS_ROOT is this
# checkout, $HARNESS_EVAL_TARGET the tree under test), trap (what it guards),
# timeout (seconds, default 900), enabled (false skips). Exit 0 passes, 77
# skips (cannot run here), anything else fails.

checks:
  - id: no-org-names
    run: python3 -I "$HARNESS_ROOT/evals/checks/no-names.py"
    trap: >
      A team, org, product or person name lands in a tracked file of this
      public repo (path or content), including launchd labels.
    timeout: 60

  - id: mcp-replay
    run: python3 -I "$HARNESS_ROOT/evals/checks/mcp_replay.py" --require-mcp-major 2
    trap: >
      An mcp SDK upgrade (or a port to a new SDK API) silently changes what
      the offload/delegate servers expose: tool names, schemas, error text,
      progress messages. Also fails unless both PEP-723 headers pin mcp 2.x.
    timeout: 600

  - id: mcp-modern
    run: uv run --quiet --script "$HARNESS_ROOT/evals/checks/mcp_modern.py"
    trap: >
      A client on the 2026-07-28 protocol gets different results from the
      offload server, or progress behaves differently from what USING.md says
      (spec: log messages only for requests that opt in).
    timeout: 600
  - id: delegate-config
    run: bash "$HARNESS_ROOT/evals/checks/delegate_config.sh"
    trap: >
      A delegate adapter is configured with a model alias it cannot run (a
      local alias, a concrete model name, an alias with no mapping for that
      CLI) and nothing says so until a delegated call fails mid-session.
    timeout: 300

  - id: kill-group
    run: python3 -I "$HARNESS_ROOT/evals/checks/kill_group.py"
    trap: >
      A delegated CLI is stopped (timeout, cancel) but a descendant it started
      keeps running because only the leader was checked.
    timeout: 120

  - id: delegate-worktrees
    run: python3 -I "$HARNESS_ROOT/evals/checks/delegate_worktrees.py"
    trap: >
      A delegated task edits the user's checkout, two tasks on one repo touch
      each other's files, or a killed run (SIGTERM, client gone, SIGKILL)
      leaves a worktree behind.
    timeout: 600
