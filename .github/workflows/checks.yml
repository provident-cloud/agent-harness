# Deterministic harness self-checks (evals/checks.yaml). No agent, no judge, no
# LiteLLM proxy -- the agent replay cases in evals/cases.yaml stay out of CI on
# purpose (see evals/README.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
      - name: bin/eval --checks-only --strict
        env:
          HARNESS_ROOT: ${{ github.workspace }}
        run: bin/eval --checks-only --strict
